[project]
name = "origit-console"
version = "0.1.0"
description = "Origit Console — hosted web view of git repositories with agent provenance (origit.uk)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "markdown>=3.6",
  "origit",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
origit = { path = "../origit", editable = true }

[tool.pytest.ini_options]
testpaths = ["backend_tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
